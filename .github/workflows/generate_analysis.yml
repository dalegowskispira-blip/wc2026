name: 生成赛前分析

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'  # 每天北京时间14:00（UTC 6:00）自动跑

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 签出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests anthropic

      - name: 运行分析生成脚本
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_analysis.py --all

      - name: 提交更新
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add data/predictions.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动生成赛前分析：$(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

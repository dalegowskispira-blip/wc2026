<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WC2026 海报</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#06060f;display:flex;flex-direction:column;align-items:center;padding:20px 0 48px;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}

/* ── 截图块：position:relative + overflow:hidden 强制固定尺寸 ── */
.shot{
  position:relative;
  width:390px;
  height:844px;
  overflow:hidden;
  background:linear-gradient(160deg,#0d0d1a 0%,#0a0a14 60%,#0d1020 100%);
  border-radius:16px;
  box-shadow:0 8px 48px rgba(0,0,0,.85);
}

/* ── 所有内部区域用 position:absolute 固定坐标，不参与高度流 ── */
.shot .ph{
  position:absolute;top:0;left:0;right:0;
  background:linear-gradient(135deg,#1a1430 0%,#0e1628 100%);
  border-bottom:1px solid rgba(245,194,0,.15);
  padding:14px 18px 11px;
  overflow:hidden;
}
.shot .ds{                         /* date strip */
  position:absolute;left:0;right:0;
  height:24px;
  background:rgba(245,194,0,.04);
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:10.5px;color:rgba(255,255,255,.35);
  letter-spacing:.3px;padding:5px 18px 0;
  overflow:hidden;
}
.shot .pf{
  position:absolute;bottom:0;left:0;right:0;
  height:44px;
  text-align:center;
  border-top:1px solid rgba(255,255,255,.06);
  padding:9px 18px 0;
}
.shot .content{
  position:absolute;left:0;right:0;
  overflow:hidden;
}

/* ── 含 stat bar 的页（header ≈ 90px）── */
.shot.has-stat .ph  {height:90px}
.shot.has-stat .ds  {top:90px}
.shot.has-stat .content{top:114px;bottom:44px;padding:8px 12px 3px}

/* ── 无 stat bar 的页（header ≈ 65px）── */
.shot.no-stat .ph {height:65px}
.shot.no-stat .ds {top:65px}
.shot.no-stat .content{top:89px;bottom:44px;padding:10px 12px 4px}

/* ── header 元素 ── */
.ph-title{font-size:20px;font-weight:800;color:#f5c200;letter-spacing:1px;line-height:1}
.ph-sub{margin-top:4px;font-size:11px;color:rgba(255,255,255,.38);letter-spacing:.4px;line-height:1}
.ph-stat{margin-top:7px;display:inline-flex;align-items:center;gap:5px;background:rgba(245,194,0,.08);border:1px solid rgba(245,194,0,.2);border-radius:20px;padding:3px 11px}
.ph-stat-label{font-size:10.5px;color:rgba(255,255,255,.42)}
.ph-stat-val{font-size:11.5px;font-weight:700;color:#f5c200;margin-left:3px}

/* ── footer 元素 ── */
.pf-disclaimer{font-size:10.5px;color:rgba(255,255,255,.2);letter-spacing:.5px}
.pf-brand{margin-top:2px;font-size:9.5px;color:rgba(245,194,0,.26);letter-spacing:.5px}

/* ── 预测卡片 ── */
.card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:10px 12px 9px;margin-bottom:7px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.card-teams{font-size:12.5px;font-weight:700;color:#f0f0f0;letter-spacing:.2px}
.card-meta{display:flex;gap:5px;align-items:center;flex-shrink:0;margin-left:6px}
.card-time{font-size:9.5px;color:rgba(255,255,255,.3)}
.gpill{font-size:9px;padding:2px 5px;border-radius:99px;background:rgba(245,194,0,.12);color:#f5c200;font-weight:600}
.card-lean{font-size:9.5px;color:rgba(255,255,255,.3);margin-bottom:5px}
.card-lean span{color:rgba(245,194,0,.72);font-weight:600}

/* ── Chips ── */
.chips{display:flex;gap:5px}
.chip{flex:1;border-radius:8px;padding:7px 3px 6px;text-align:center;min-width:0}
.chip-label{font-size:8.5px;font-weight:600;letter-spacing:.4px;margin-bottom:3px}
.chip-scores{display:flex;flex-direction:column;gap:2px}
.chip-s1{font-size:16px;font-weight:800;letter-spacing:1px;line-height:1.1}
.chip-s2{font-size:11px;font-weight:600;letter-spacing:.5px;opacity:.7;line-height:1.1}
.chip-main{background:rgba(34,197,94,.11);border:1px solid rgba(34,197,94,.28)}
.chip-main .chip-label{color:#86efac}
.chip-main .chip-s1,.chip-main .chip-s2{color:#22c55e}
.chip-secondary{background:rgba(245,194,0,.09);border:1px solid rgba(245,194,0,.25)}
.chip-secondary .chip-label{color:#fde68a}
.chip-secondary .chip-s1,.chip-secondary .chip-s2{color:#f5c200}
.chip-upset{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.26)}
.chip-upset .chip-label{color:#fca5a5}
.chip-upset .chip-s1,.chip-upset .chip-s2{color:#ef4444}
.chip-none{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}
.chip-none .chip-label,.chip-none .chip-s1{color:rgba(255,255,255,.2)}

/* ── 分析卡片 ── */
.ac{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:12px 13px 13px;margin-bottom:9px}
.ac-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.ac-teams{font-size:13px;font-weight:700;color:#f0f0f0;letter-spacing:.2px}
.ac-meta{display:flex;gap:5px;align-items:center;flex-shrink:0;margin-left:6px}
.ac-text{font-size:12px;line-height:1.68;color:rgba(255,255,255,.72)}
.ac-pending{font-size:12px;color:rgba(255,255,255,.28);font-style:italic}

.no-data{padding:40px 20px;text-align:center;color:rgba(255,255,255,.25);font-size:13px}

/* ── 块间分隔（不参与截图，仅屏幕导航）── */
.sep{width:390px;background:#06060f;padding:12px 0;text-align:center;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:.5px;border-top:1px dashed rgba(255,255,255,.12)}
</style>
</head>
<body>

<div id="poster-root"><div class="sep" style="border-top:none;padding-top:0">加载中…</div></div>

<script>
const FLAGS={
  '西班牙':'🇪🇸','法国':'🇫🇷','阿根廷':'🇦🇷','英格兰':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','葡萄牙':'🇵🇹',
  '德国':'🇩🇪','巴西':'🇧🇷','荷兰':'🇳🇱','比利时':'🇧🇪','挪威':'🇳🇴',
  '摩洛哥':'🇲🇦','日本':'🇯🇵','美国':'🇺🇸','墨西哥':'🇲🇽','韩国':'🇰🇷',
  '加拿大':'🇨🇦','澳大利亚':'🇦🇺','克罗地亚':'🇭🇷','哥伦比亚':'🇨🇴','乌拉圭':'🇺🇾',
  '瑞士':'🇨🇭','厄瓜多尔':'🇪🇨','塞内加尔':'🇸🇳','科特迪瓦':'🇨🇮','苏格兰':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
  '瑞典':'🇸🇪','波黑':'🇧🇦','土耳其':'🇹🇷','巴拉圭':'🇵🇾','卡塔尔':'🇶🇦',
  '伊朗':'🇮🇷','埃及':'🇪🇬','沙特':'🇸🇦','佛得角':'🇨🇻','新西兰':'🇳🇿',
  '伊拉克':'🇮🇶','阿尔及利亚':'🇩🇿','奥地利':'🇦🇹','约旦':'🇯🇴','刚果(金)':'🇨🇩',
  '乌兹别克':'🇺🇿','加纳':'🇬🇭','巴拿马':'🇵🇦','南非':'🇿🇦','海地':'🇭🇹',
  '库拉索':'🇨🇼','突尼斯':'🇹🇳','捷克':'🇨🇿',
};

const PREDS={
  '西班牙|佛得角':{win:88,draw:8,loss:4,scores:[{s:'3-0',p:28},{s:'2-0',p:24},{s:'4-0',p:14},{s:'2-1',p:12},{s:'3-1',p:10}]},
  '法国|塞内加尔':{win:75,draw:16,loss:9,scores:[{s:'2-0',p:24},{s:'2-1',p:22},{s:'3-1',p:14},{s:'1-0',p:14},{s:'1-1',p:12}]},
  '伊拉克|挪威':{win:18,draw:22,loss:60,scores:[{s:'0-2',p:24},{s:'0-1',p:20},{s:'1-2',p:18},{s:'0-3',p:14},{s:'1-1',p:12}]},
  '阿根廷|阿尔及利亚':{win:82,draw:12,loss:6,scores:[{s:'3-0',p:24},{s:'2-0',p:22},{s:'3-1',p:16},{s:'2-1',p:14},{s:'4-0',p:10}]},
  '奥地利|约旦':{win:65,draw:22,loss:13,scores:[{s:'2-0',p:22},{s:'2-1',p:18},{s:'1-0',p:18},{s:'3-0',p:12},{s:'1-1',p:14}]},
  '葡萄牙|刚果(金)':{win:84,draw:11,loss:5,scores:[{s:'3-0',p:28},{s:'2-0',p:22},{s:'4-0',p:14},{s:'3-1',p:14},{s:'2-1',p:10}]},
  '英格兰|克罗地亚':{win:58,draw:25,loss:17,scores:[{s:'2-1',p:22},{s:'1-0',p:20},{s:'2-0',p:16},{s:'1-1',p:16},{s:'3-1',p:10}]},
  '加纳|巴拿马':{win:52,draw:28,loss:20,scores:[{s:'1-0',p:22},{s:'1-1',p:20},{s:'2-1',p:16},{s:'2-0',p:14},{s:'0-0',p:14}]},
  '乌兹别克|哥伦比亚':{win:22,draw:28,loss:50,scores:[{s:'0-2',p:24},{s:'0-1',p:20},{s:'1-2',p:16},{s:'1-1',p:16},{s:'0-3',p:12}]},
  '美国|澳大利亚':{win:50,draw:28,loss:22,scores:[{s:'2-1',p:22},{s:'1-0',p:18},{s:'1-1',p:18},{s:'2-0',p:14},{s:'1-2',p:8}]},
  '苏格兰|摩洛哥':{win:25,draw:30,loss:45,scores:[{s:'0-1',p:22},{s:'1-2',p:18},{s:'1-1',p:18},{s:'0-2',p:14},{s:'1-0',p:8}]},
  '巴西|海地':{win:88,draw:9,loss:3,scores:[{s:'3-0',p:28},{s:'2-0',p:22},{s:'4-0',p:16},{s:'3-1',p:14},{s:'1-1',p:6}]},
  '土耳其|巴拉圭':{win:42,draw:30,loss:28,scores:[{s:'1-1',p:22},{s:'2-1',p:18},{s:'1-0',p:16},{s:'2-0',p:12},{s:'0-1',p:10}]},
};

function flipScore(s){const[h,a]=s.split('-');return`${a}-${h}`}
function flipLean(l){return l==='主胜'?'客胜':l==='客胜'?'主胜':l}

function deriveScores(home,away,jp){
  const k1=`${home}|${away}`,k2=`${away}|${home}`;
  let e=null,rev=false;
  if(jp){
    if(jp[k1]){e=jp[k1];rev=false}
    else if(jp[k2]){e=jp[k2];rev=true}
  }
  if(e&&e.scores&&Array.isArray(e.scores.main)){
    const f=arr=>(arr||[]).map(flipScore);
    return{
      main:     rev?f(e.scores.main)     :(e.scores.main     ||[]),
      secondary:rev?f(e.scores.secondary):(e.scores.secondary||[]),
      upset:    rev?f(e.scores.upset)    :(e.scores.upset    ||[]),
      dirLabel: rev?flipLean(e.lean||'主胜'):(e.lean||'主胜'),
      analysis: e.analysis||'',
    };
  }
  let p=null;
  if(PREDS[k1]){p=PREDS[k1];rev=false}
  else if(PREDS[k2]){p=PREDS[k2];rev=true}
  if(!p)return null;
  const hw=rev?p.loss:p.win,aw=rev?p.win:p.loss;
  const md=hw>=p.draw&&hw>=aw?'home':p.draw>=hw&&p.draw>=aw?'draw':'away';
  const parsed=p.scores.map(s=>{
    let[h,a]=s.s.split('-').map(Number);
    if(rev){[h,a]=[a,h]}
    return{score:`${h}-${a}`,dir:h>a?'home':h<a?'away':'draw',pp:s.p};
  }).sort((a,b)=>b.pp-a.pp);
  const ma=parsed.filter(s=>s.dir===md).map(s=>s.score);
  const ud=md==='home'?'away':md==='away'?'home':hw>=aw?'away':'home';
  const ua=parsed.filter(s=>s.dir===ud).map(s=>s.score);
  const oa=parsed.filter(s=>s.dir!==md&&s.dir!==ud).map(s=>s.score);
  return{
    main:ma.slice(0,2),
    secondary:ma.slice(2,4).concat(oa.slice(0,1)).slice(0,2),
    upset:ua.slice(0,1),
    dirLabel:md==='home'?'主胜':md==='away'?'客胜':'平局',
    analysis:'',
  };
}

function chip(cls,label,scores){
  if(!scores||!scores.length)
    return`<div class="chip chip-none"><div class="chip-label">${label}</div><div class="chip-scores"><div class="chip-s1">-</div></div></div>`;
  return`<div class="chip ${cls}"><div class="chip-label">${label}</div><div class="chip-scores"><div class="chip-s1">${scores[0]||''}</div>${scores[1]?`<div class="chip-s2">${scores[1]}</div>`:''}</div></div>`;
}

function predCard(m,jp){
  const sc=deriveScores(m.home,m.away,jp);
  const hf=FLAGS[m.home]||'🏳️',af=FLAGS[m.away]||'🏳️';
  return`<div class="card">
<div class="card-head"><div class="card-teams">${hf} ${m.home} <span style="color:rgba(255,255,255,.28);font-weight:400">vs</span> ${m.away} ${af}</div><div class="card-meta"><span class="card-time">${m.bjt||''} BJT</span><span class="gpill">${m.group}组</span></div></div>
${sc?`<div class="card-lean">模型倾向 <span>${sc.dirLabel}</span></div>`:''}
<div class="chips">${chip('chip-main','主推',sc?.main)}${chip('chip-secondary','次选',sc?.secondary)}${chip('chip-upset','爆冷',sc?.upset)}</div>
</div>`;
}

function analysisCard(m,jp){
  const sc=deriveScores(m.home,m.away,jp);
  const hf=FLAGS[m.home]||'🏳️',af=FLAGS[m.away]||'🏳️';
  const body=sc?.analysis?`<div class="ac-text">${sc.analysis}</div>`:`<div class="ac-pending">分析生成中…</div>`;
  return`<div class="ac"><div class="ac-head"><div class="ac-teams">${hf} ${m.home} <span style="color:rgba(255,255,255,.28);font-weight:400">vs</span> ${m.away} ${af}</div><div class="ac-meta"><span class="card-time">${m.bjt||''} BJT</span><span class="gpill">${m.group}组</span></div></div>${body}</div>`;
}

function yesterdayStat(matches,pdata){
  const jp=pdata?.predictions||null;
  const finished=(matches||[]).filter(m=>m.status==='finished'&&m.home_score!=null&&m.away_score!=null);
  const ystr=finished.map(m=>m.date).sort().pop();
  const ms=finished.filter(m=>m.date===ystr);
  if(ms.length){
    const actual=m=>`${m.home_score}-${m.away_score}`;
    const c=ms.filter(m=>{
      const sc=deriveScores(m.home,m.away,jp);
      const all=[...(sc?.main||[]),...(sc?.secondary||[]),...(sc?.upset||[])];
      return all.includes(actual(m));
    }).length;
    return`昨日比分 ${ms.length} 中 ${c}`;
  }
  return'比分命中统计';
}

/* 每页容量：比分页每页 4 场、判断依据每页 2 场，超出自动分页 */
const SCORE_PER_PAGE=4, ANALYSIS_PER_PAGE=2;

function chunk(arr,n){const out=[];for(let i=0;i<arr.length;i+=n)out.push(arr.slice(i,i+n));return out;}

function shotBlock({hasStat,title,sub,statHTML,dateLabel,contentHTML}){
  return`<div class="shot ${hasStat?'has-stat':'no-stat'}">
  <div class="ph">
    <div class="ph-title">${title}</div>
    <div class="ph-sub">${sub}</div>
    ${hasStat?`<div class="ph-stat">${statHTML}</div>`:''}
  </div>
  <div class="ds">${dateLabel}</div>
  <div class="content">${contentHTML}</div>
  <div class="pf">
    <div class="pf-disclaimer">娱乐仅供参考 · 理性观赛</div>
    <div class="pf-brand">WC2026 看板</div>
  </div>
</div>`;
}
function sep(text,first){return`<div class="sep"${first?' style="border-top:none;padding-top:0"':''}>${text}</div>`;}

function render(matches,pdata){
  const tmrw=new Date(Date.now()+8*3600000+86400000);
  const nd=[tmrw.getUTCFullYear(),String(tmrw.getUTCMonth()+1).padStart(2,'0'),String(tmrw.getUTCDate()).padStart(2,'0')].join('-');
  const ms=(matches||[]).filter(m=>m.date===nd).sort((a,b)=>(a.bjt||'').localeCompare(b.bjt||''));

  const dt=new Date(nd+'T12:00:00+08:00');
  const wd=['日','一','二','三','四','五','六'][dt.getDay()];
  const dl=`${dt.getMonth()+1}月${dt.getDate()}日（周${wd}）· 北京时间`;

  const statHTML=`<span class="ph-stat-label">战绩</span><span class="ph-stat-val">${yesterdayStat(matches,pdata)}</span>`;
  const jp=pdata?.predictions||null;
  const root=document.getElementById('poster-root');

  if(!ms.length){
    root.innerHTML=sep('📸 比分预测',true)+shotBlock({
      hasStat:true,title:'⚽ WC2026 今日比分参考',sub:'三档比分 · 模型倾向 · 娱乐向',
      statHTML,dateLabel:dl,contentHTML:'<div class="no-data">暂无待开赛比赛</div>'});
    return;
  }

  const scorePages=chunk(ms,SCORE_PER_PAGE);
  const analysisPages=chunk(ms,ANALYSIS_PER_PAGE);
  let html='';

  // ── 比分预测页（可多页）──
  scorePages.forEach((grp,i)=>{
    const tag=scorePages.length>1?`（${i+1}/${scorePages.length}）`:'';
    html+=sep(`📸 比分预测${tag}`,i===0)+shotBlock({
      hasStat:i===0,                          // 战绩条只在第一页显示
      title:`⚽ WC2026 今日比分参考${tag}`,
      sub:'三档比分 · 模型倾向 · 娱乐向',
      statHTML,dateLabel:dl,
      contentHTML:grp.map(m=>predCard(m,jp)).join('')});
  });

  // ── 判断依据页（可多页）──
  analysisPages.forEach((grp,i)=>{
    const tag=analysisPages.length>1?`（${i+1}/${analysisPages.length}）`:'';
    html+=sep(`📸 判断依据${tag}`)+shotBlock({
      hasStat:false,
      title:`🔍 WC2026 判断依据${tag}`,
      sub:'模型分析 · 赛前参考',
      dateLabel:dl,
      contentHTML:grp.map(m=>analysisCard(m,jp)).join('')});
  });

  root.innerHTML=html;
}

const FB_M=[
  {id:29,date:'2026-06-20',group:'D',home:'美国',away:'澳大利亚',bjt:'02:00',status:'upcoming'},
  {id:30,date:'2026-06-20',group:'C',home:'苏格兰',away:'摩洛哥',bjt:'05:00',status:'upcoming'},
  {id:31,date:'2026-06-20',group:'C',home:'巴西',away:'海地',bjt:'08:00',status:'upcoming'},
  {id:32,date:'2026-06-20',group:'D',home:'土耳其',away:'巴拉圭',bjt:'11:00',status:'upcoming'},
];
const FB_P={records:[{match_id:21,result:'wrong'},{match_id:22,result:'correct'},{match_id:23,result:'correct'},{match_id:24,result:'correct'}]};

(async()=>{
  let matches,pdata;
  try{
    const[mr,pr]=await Promise.all([fetch('data/matches.json?t='+Date.now()),fetch('data/predictions.json?t='+Date.now())]);
    matches=(await mr.json()).matches||[];pdata=await pr.json();
  }catch(e){
    console.warn('fetch failed:',e.message);matches=FB_M;pdata=FB_P;
  }
  render(matches,pdata);
})();
</script>
</body>
</html>

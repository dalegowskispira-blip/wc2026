<!-- V4.3: 积分榜动态计算/删除硬编码STANDINGS/getMI改用calcStandings() -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="9d2941dc-d76f-4da2-b4a2-0da44d733b64"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026世界杯 · 预测看板</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  --bg:#0d0d11;--bg2:#141418;--bg3:#1c1c23;--card:#16161d;
  --b1:rgba(255,255,255,0.055);--b2:rgba(255,255,255,0.10);
  --t1:#e8e8f0;--t2:#8888a0;--t3:#484860;
  --ac:#7c6fff;--ac2:#a399ff;
  --green:#22c55e;--red:#ef4444;--amber:#f59e0b;--cyan:#22d3ee;--pink:#f472b6;
  --font:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:var(--font);min-height:100vh;font-size:14px}

/* ── LOGIN ── */
#login{display:none;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(124,111,255,0.12) 0%,transparent 60%),var(--bg)}
.login-box{background:var(--card);border:1px solid var(--b2);border-radius:20px;padding:48px 40px;width:360px;text-align:center}
.login-logo{font-size:48px;line-height:1;margin-bottom:12px}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px;letter-spacing:-.02em}
.login-sub{font-size:13px;color:var(--t2);margin-bottom:32px}
.login-box input{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:13px 16px;color:var(--t1);font-size:14px;outline:none;margin-bottom:10px;font-family:var(--font)}
.login-box input:focus{border-color:var(--ac)}
.login-btn{width:100%;background:var(--ac);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;cursor:pointer;font-weight:600;letter-spacing:.01em;transition:opacity .2s}
.login-btn:hover{opacity:.85}
.login-err{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}

/* ── APP ── */
#app{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;background:rgba(20,20,24,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--b1);position:sticky;top:0;z-index:200}
.topbar-l{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:20px}
.topbar-title{font-size:14px;font-weight:700;letter-spacing:-.01em}
.topbar-r{display:flex;align-items:center;gap:14px}
.live-pill{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--green);background:rgba(34,197,94,.1);padding:4px 10px;border-radius:99px;border:1px solid rgba(34,197,94,.2)}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.topbar-time{font-size:11px;color:var(--t3)}

.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--b1);padding:0 24px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-tab{padding:11px 16px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.nav-tab.active{color:var(--ac2);border-color:var(--ac)}
.nav-tab:hover:not(.active){color:var(--t1)}

.wrap{padding:18px 24px;max-width:1060px;margin:0 auto}
.page{display:none}.page.active{display:block}

/* ── ACCURACY BANNER ── */
.acc-banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.acc-card{background:var(--card);border:1px solid var(--b1);border-radius:12px;padding:14px 16px;text-align:center}
.acc-card-label{font-size:10px;color:var(--t2);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.acc-card-val{font-size:24px;font-weight:700}
.acc-card-sub{font-size:10px;color:var(--t3);margin-top:3px}
.accuracy-ring{position:relative;width:64px;height:64px;margin:0 auto 6px}
.accuracy-ring canvas{width:64px!important;height:64px!important}
.accuracy-ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}

/* ── SEARCH ── */
.search-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-row input[type=date]{background:var(--card);border:1px solid var(--b2);border-radius:8px;padding:8px 12px;color:var(--t1);font-size:12px;outline:none;font-family:var(--font)}
.search-row input:focus{border-color:var(--ac)}
.btn-primary{background:var(--ac);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:500;transition:opacity .2s}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--t2);border:1px solid var(--b2);border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer}
.hint{font-size:11px;color:var(--t3)}

/* ── DAY GROUP ── */
.day-hd{display:flex;align-items:center;gap:8px;margin:20px 0 10px}
.day-hd-label{font-size:12px;font-weight:600;color:var(--t1)}
.day-hd-count{font-size:10px;color:var(--t2);background:var(--bg3);padding:2px 7px;border-radius:4px}
.day-hd-line{flex:1;height:1px;background:var(--b1)}

/* ── MATCH CARD ── */
.mc{background:var(--card);border:1px solid var(--b1);border-radius:12px;margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.mc:hover{border-color:var(--b2)}
.mc-inner{padding:13px 16px}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mc-meta{display:flex;align-items:center;gap:6px}
.gpill{font-size:10px;background:rgba(124,111,255,.14);color:var(--ac2);padding:2px 8px;border-radius:4px;font-weight:500}
.tpill{font-size:10px;color:var(--t3)}
.spill{font-size:10px;padding:3px 8px;border-radius:4px;font-weight:500}
.sp-done{background:rgba(34,197,94,.1);color:var(--green)}
.sp-live{background:rgba(239,68,68,.12);color:var(--red)}
.sp-up{background:rgba(255,255,255,.05);color:var(--t2)}

.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:11px}
.team{display:flex;flex-direction:column;gap:2px;cursor:pointer}
.team:hover .tn{color:var(--ac2)}
.team.r{text-align:right;align-items:flex-end}
.team-fn{display:flex;align-items:center;gap:6px}
.team.r .team-fn{flex-direction:row-reverse}
.tf{font-size:20px}
.tn{font-size:14px;font-weight:600;transition:color .15s}
.tr{font-size:10px;color:var(--t3)}
.score-box{text-align:center;min-width:56px}
.score-num{font-size:22px;font-weight:700;letter-spacing:1px}
.score-vs{font-size:14px;color:var(--t3);font-weight:600}
.score-lbl{font-size:9px;color:var(--t3);margin-top:1px}

/* ── PREDICTION ── */
.pred-wrap{border-top:1px solid var(--b1);padding-top:11px}
.pred-hd{font-size:9px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.pred-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
.pb-item{text-align:center}
.pb-label{font-size:9px;color:var(--t2);margin-bottom:4px}
.pb-track{height:3px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-bottom:3px}
.pb-fill{height:100%;border-radius:99px}
.fill-w{background:var(--green)}.fill-d{background:var(--amber)}.fill-l{background:var(--red)}
.pb-val{font-size:12px;font-weight:600}
.tv-w{color:var(--green)}.tv-d{color:var(--amber)}.tv-l{color:var(--red)}

.other-prob{font-size:10px;color:var(--t3);margin-bottom:7px}
.scores-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sp-pill{font-size:11px;background:var(--bg3);border:1px solid var(--b1);border-radius:6px;padding:4px 10px;color:var(--t2);display:inline-flex;align-items:center;gap:5px}
.sp-pill.top{border-color:rgba(124,111,255,.35);background:rgba(124,111,255,.08)}
.sp-pill .prob{color:var(--ac2);font-weight:600}
.insights{display:flex;flex-direction:column;gap:4px}
.insight{font-size:11px;color:var(--t2);display:flex;gap:5px}
.insight::before{content:'·';color:var(--t3);flex-shrink:0}

/* ── PREDICTION RECORD ── */
.rec-card{background:var(--card);border:1px solid var(--b1);border-radius:12px;margin-bottom:8px;overflow:hidden}
.rec-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--b1)}
.rec-match{font-size:13px;font-weight:600}
.rec-score{font-size:12px;color:var(--t2)}
.rec-badge{font-size:10px;font-weight:600;padding:3px 10px;border-radius:99px}
.badge-correct{background:rgba(34,197,94,.12);color:var(--green)}
.badge-wrong{background:rgba(239,68,68,.1);color:var(--red)}
.rec-body{padding:12px 16px}
.rec-pred-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.rec-pred-item{font-size:11px;color:var(--t2)}
.rec-pred-item span{color:var(--t1);font-weight:500}
.review-box{background:var(--bg3);border-radius:8px;padding:10px 12px;border-left:3px solid var(--ac)}
.review-player{font-size:11px;color:var(--ac2);font-weight:600;margin-bottom:4px}
.review-text{font-size:12px;color:var(--t2);line-height:1.7}
.no-review{font-size:11px;color:var(--t3);font-style:italic}

/* ── STANDINGS ── */
.stg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.st-card{background:var(--card);border:1px solid var(--b1);border-radius:12px;overflow:hidden}
.st-hd{padding:8px 13px;background:rgba(124,111,255,.07);border-bottom:1px solid var(--b1);font-size:11px;font-weight:600;color:var(--ac2)}
.st-table{width:100%;border-collapse:collapse;font-size:11px}
.st-table th{padding:6px 8px;color:var(--t3);font-weight:500;text-align:center;border-bottom:1px solid var(--b1)}
.st-table th:first-child{text-align:left}
.st-table td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--b1)}
.st-table td:first-child{text-align:left}
.st-table tr:last-child td{border:none}
.st-table tr.qualify td:first-child{border-left:2px solid var(--green)}
.rk{color:var(--t3);width:14px;display:inline-block}
.tc{cursor:pointer}.tc:hover{color:var(--ac2)}

/* ── TEAM GRID ── */
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:20px}
.tg-card{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s,background .15s}
.tg-card:hover{border-color:var(--ac);background:rgba(124,111,255,.05)}
.tg-flag{font-size:26px;margin-bottom:5px}
.tg-name{font-size:12px;font-weight:600}
.tg-rank{font-size:10px;color:var(--t3)}

/* ── TEAM DETAIL ── */
.back-btn{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:7px 13px;font-size:12px;color:var(--t2);cursor:pointer;margin-bottom:16px;transition:color .15s}
.back-btn:hover{color:var(--t1)}
.team-hd{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.team-flag-lg{font-size:52px}
.team-hd-name{font-size:24px;font-weight:700;letter-spacing:-.02em}
.team-hd-sub{font-size:12px;color:var(--t2);margin-top:3px}
.form-dots{display:flex;gap:4px;margin-top:8px}
.fd{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}

.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:20px}
.tsc{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:11px 13px}
.tsc-l{font-size:9px;color:var(--t2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.tsc-v{font-size:20px;font-weight:700}

.sec-title{font-size:10px;font-weight:600;color:var(--t2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;margin-top:20px}
.player-card{background:var(--card);border:1px solid var(--b1);border-radius:10px;padding:11px 14px;margin-bottom:7px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:border-color .15s}
.player-card:hover{border-color:var(--ac)}
.pnum{font-size:14px;font-weight:700;color:var(--ac2);width:26px;text-align:center;flex-shrink:0}
.pinfo{flex:1}
.pname{font-size:13px;font-weight:600}
.ppos{font-size:10px;color:var(--t2);margin-top:1px}
.pclub{font-size:10px;color:var(--t3)}
.prating{font-size:16px;font-weight:700;color:var(--ac2);background:rgba(124,111,255,.1);border-radius:7px;padding:4px 10px}
.player-detail{display:none;background:var(--bg3);border-radius:0 0 10px 10px;padding:12px 14px;border-top:1px solid var(--b1)}
.player-detail.open{display:block}
.attr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.attr-item{text-align:center}
.attr-val{font-size:12px;font-weight:600}
.attr-bar{height:2px;background:var(--bg);border-radius:99px;margin:3px 0;overflow:hidden}
.attr-fill{height:100%;background:linear-gradient(90deg,var(--ac),var(--cyan));border-radius:99px}
.attr-name{font-size:9px;color:var(--t3)}
.radar-wrap{max-width:240px;margin:0 auto}

.section-hd-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:20px}

.no-data{text-align:center;padding:48px;color:var(--t3)}
.no-data-icon{font-size:36px;margin-bottom:10px}

.footer{text-align:center;padding:18px 24px;font-size:10px;color:var(--t3);border-top:1px solid var(--b1);margin-top:32px;line-height:1.8}

/* ── LOADING ── */
#loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;transition:opacity .3s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
.loading-spinner{font-size:32px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .topbar,.nav,.wrap{padding-left:14px;padding-right:14px}
  .tn{font-size:12px}.score-num{font-size:18px}
  .attr-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── UPSET RISK / 战意因子 ── */
.upset-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:5px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--b1)}
.upset-label{font-size:10px;color:var(--t2);flex:1}
.upset-badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px}
.upset-high{background:rgba(239,68,68,.15);color:#fca5a5}
.upset-mid{background:rgba(245,158,11,.12);color:#fcd34d}
.upset-low{background:rgba(34,197,94,.1);color:#86efac}
.mi-badge{font-size:10px;padding:2px 7px;border-radius:4px;margin-left:4px}
.mi-high{background:rgba(239,68,68,.15);color:var(--red)}
.mi-neutral{background:rgba(124,111,255,.12);color:var(--ac2)}
.mi-low{background:rgba(255,255,255,.05);color:var(--t3)}
.tactic-tag{font-size:9px;font-weight:600;padding:2px 6px;border-radius:4px;margin-left:4px;vertical-align:middle}
.tactic-pos{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.2)}
.tactic-def{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.2)}
.tactic-cnt{background:rgba(6,182,212,.12);color:#67e8f9;border:1px solid rgba(6,182,212,.2)}
.tactic-bal{background:rgba(124,111,255,.12);color:var(--ac2);border:1px solid rgba(124,111,255,.2)}
.kpw-alert{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:7px 11px;margin-bottom:8px;font-size:11px;color:#fca5a5;display:flex;gap:6px;align-items:flex-start}
.kpw-icon{flex-shrink:0}
/* ── SCORE PROGRESS BARS ── */
.score-pred-bars{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.spb-row{display:flex;align-items:center;gap:8px}
.spb-label{font-size:11px;color:var(--t2);width:36px;text-align:right;flex-shrink:0}
.spb-track{flex:1;height:14px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative}
.spb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--ac),var(--cyan));transition:width .3s}
.spb-fill.top-fill{background:linear-gradient(90deg,#7c6fff,#22d3ee)}
.spb-pct{font-size:10px;font-weight:600;color:var(--ac2);width:30px;flex-shrink:0}
/* ── PLAYER BADGES ── */
.player-badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.pbadge{font-size:9px;padding:1px 6px;border-radius:3px;font-weight:600}
.pbadge-key{background:rgba(250,204,21,.15);color:#fde68a;border:1px solid rgba(250,204,21,.25)}
.pbadge-anchor{background:rgba(124,111,255,.15);color:var(--ac2);border:1px solid rgba(124,111,255,.25)}
.pbadge-kpw{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
/* ── TACTIC WEAKNESS ── */
.tactic-weakness{background:rgba(239,68,68,.06);border-left:2px solid var(--red);border-radius:0 7px 7px 0;padding:7px 11px;margin-top:8px;font-size:11px;color:var(--t2)}
.tactic-weakness strong{color:#fca5a5}


/* ── V4.2: 爆冷标签 ── */
.upset-result-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);margin-left:6px;animation:upsetPulse 2s infinite}
@keyframes upsetPulse{0%,100%{opacity:1}50%{opacity:.7}}

/* ── V4: H2H 历史交锋 ── */
.h2h-toggle{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--t2);cursor:pointer;padding:6px 0;border-top:1px solid var(--b1);margin-top:8px;user-select:none}
.h2h-toggle:hover{color:var(--t1)}
.h2h-toggle .chevron{transition:transform .2s;font-size:9px}
.h2h-toggle.open .chevron{transform:rotate(180deg)}
.h2h-body{display:none;background:var(--bg3);border-radius:8px;padding:10px 12px;margin-top:6px;border:1px solid var(--b1)}
.h2h-body.open{display:block}
.h2h-bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:8px;text-align:center}
.h2h-bar-item{font-size:10px;color:var(--t2)}
.h2h-bar-val{font-size:16px;font-weight:700;margin-bottom:3px}
.h2h-bar-track{height:4px;background:var(--bg);border-radius:99px;overflow:hidden;margin:3px auto;max-width:60px}
.h2h-bar-fill{height:100%;border-radius:99px}
.h2h-note{font-size:11px;color:var(--t2);font-style:italic;border-top:1px solid var(--b1);padding-top:7px;margin-top:3px}
.h2h-goals{display:flex;gap:12px;justify-content:center;font-size:10px;color:var(--t3);margin-bottom:6px}

/* ── V4: 风险标签 ── */
.risk-flags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.risk-flag{font-size:10px;padding:2px 9px;border-radius:99px;font-weight:500;border:1px solid}
.rf-amber{background:rgba(245,158,11,.1);color:#fcd34d;border-color:rgba(245,158,11,.25)}
.rf-green{background:rgba(34,197,94,.1);color:#86efac;border-color:rgba(34,197,94,.2)}
.rf-cyan{background:rgba(6,182,212,.1);color:#67e8f9;border-color:rgba(6,182,212,.2)}

/* ── V4: 积分榜出线形势图标 ── */
.qualify-icon{font-size:10px;margin-left:4px}
.st-footer-note{font-size:10px;color:var(--t3);text-align:center;padding:8px 12px;border-top:1px solid var(--b1)}

const SOUTH_CITIES = ['达拉斯','迈阿密','洛杉矶','休斯顿','亚特兰大','坎萨斯城'];
const EUROPEAN_TEAMS = ['西班牙','法国','德国','英格兰','葡萄牙','荷兰','比利时','挪威','克罗地亚','瑞典','瑞士','波黑','土耳其','捷克','奥地利','苏格兰','意大利'];
const SOUTHAMERICA_TEAMS = ['巴西','阿根廷','乌拉圭','哥伦比亚','厄瓜多尔','巴拉圭'];
const HOST_NATIONS = ['美国','加拿大','墨西哥'];

function getRiskFlags(home, away, matchDate) {
  const flags = [];

  // 1. 主场效应：东道主对阵排名差>30的队伍
  const isHostHome = HOST_NATIONS.some(n => home.includes(n));
  const isHostAway = HOST_NATIONS.some(n => away.includes(n));
  const homeRank = RANKS[home] || 50;
  const awayRank = RANKS[away] || 50;
  if (isHostHome && (awayRank - homeRank) > 30)
    flags.push({text:'🏟️ 主场效应加持', cls:'rf-green'});
  if (isHostAway && (homeRank - awayRank) > 30)
    flags.push({text:'🏟️ 客队本土气氛', cls:'rf-green'});

  // 2. 气候风险：欧洲/南美队在夏季南部城市比赛
  const awayIsEuroSA = [...EUROPEAN_TEAMS, ...SOUTHAMERICA_TEAMS].some(n => away.includes(n));
  const homeIsEuroSA = [...EUROPEAN_TEAMS, ...SOUTHAMERICA_TEAMS].some(n => home.includes(n));
  if (awayIsEuroSA || homeIsEuroSA)
    flags.push({text:'🌡️ 高温气候风险', cls:'rf-amber'});

  // 3. 体能透支：3天内有上一场（检查matchesData）
  if (matchDate && matchesData) {
    const matchDt = new Date(matchDate);
    const homePrev = matchesData.filter(m => m.status === 'finished' && (m.home === home || m.away === home));
    const awayPrev = matchesData.filter(m => m.status === 'finished' && (m.home === away || m.away === away));
    const checkFatigue = (prevMatches) => {
      if (!prevMatches.length) return false;
      const lastDate = new Date(prevMatches[prevMatches.length-1].date);
      return (matchDt - lastDate) / (1000*60*60*24) <= 3;
    };
    if (checkFatigue(homePrev) || checkFatigue(awayPrev))
      flags.push({text:'⚡ 体能透支风险', cls:'rf-amber'});
  }

  // 4. 定位球依赖：无高评分进攻中场但有强力头球中锋
  const checkSetPiece = (teamName) => {
    const t = TEAM_DATA[teamName];
    if (!t) return false;
    const hasStrongAM = t.players.some(p => (p.pos.includes('进攻中场') || p.pos.includes('中场')) && (p.a['视野']||0) >= 88);
    const hasHeaderFwd = t.players.some(p => (p.pos.includes('锋') || p.pos.includes('中锋')) && (p.a['头球']||0) >= 86);
    return !hasStrongAM && hasHeaderFwd;
  };
  if (checkSetPiece(home) || checkSetPiece(away))
    flags.push({text:'🎯 定位球依赖型', cls:'rf-cyan'});

  // 5. 裁判因素：双方均为低位防守型
  const homeTac = getTacticTag(home);
  const awayTac = getTacticTag(away);
  if (homeTac?.tag === '低位防守型' && awayTac?.tag === '低位防守型')
    flags.push({text:'⚖️ 高黄牌风险对决', cls:'rf-amber'});

  return flags;
}

// V4: 重写 PREDS hints（基于TEAM_DATA真实数值）
// ────────────────────────────────────────
function buildV4Hints(home, away, pred) {
  const ht = TEAM_DATA[home];
  const at = TEAM_DATA[away];
  const hints = [];

  // Hint 1: xG预估 + 射门频率（基于场均进球和控球率推算）
  if (ht && at) {
    const hGpg = parseFloat(ht.stats.gpg);
    const aGpg = parseFloat(at.stats.gpg);
    const hPos = parseFloat(ht.stats.pos);
    const aPos = parseFloat(at.stats.pos);
    // xG = 场均进球 × (控球率/50)^0.5 近似
    const hXg = (hGpg * Math.sqrt(hPos/50)).toFixed(1);
    const aXg = (aGpg * Math.sqrt(aPos/50)).toFixed(1);
    const hShots = Math.round(hPos / 4.5);
    const aShots = Math.round(aPos / 4.5);
    hints.push(`预计xG：${home.slice(0,4)} ${hXg} vs ${away.slice(0,4)} ${aXg}，射门比约 ${hShots}:${aShots}`);
  }

  // Hint 2: 核心球员对位分析（取双方最高评分球员）
  if (ht && at) {
    const hCore = [...(ht.players||[])].sort((a,b)=>b.r-a.r)[0];
    const aCore = [...(at.players||[])].sort((a,b)=>b.r-a.r)[0];
    if (hCore && aCore) {
      const hTopAttrKey = Object.keys(hCore.a||{}).sort((a,b)=>(hCore.a[b]||0)-(hCore.a[a]||0))[0];
      const hTopAttrVal = hCore.a?.[hTopAttrKey] || 0;
      // 找客队最可能防守对位的属性
      const aDefAttrKey = Object.keys(aCore.a||{}).find(k => ['防守','拦截','速度'].includes(k)) || Object.keys(aCore.a||{})[0];
      const aDefAttrVal = aCore.a?.[aDefAttrKey] || 0;
      hints.push(`${hCore.name}(${hTopAttrKey}${hTopAttrVal}) 将直接考验 ${aCore.name} 的${aDefAttrKey}能力(${aDefAttrVal})`);
    }
  }

  // Hint 3: 关键变量（积分形势已由buildEnhancedHints处理，这里补充历史心理）
  const h2hResult = getH2H(home, away);
  if (h2hResult) {
    const { data, rev } = h2hResult;
    const homeW = rev ? data.losses : data.wins;
    const awayW = rev ? data.wins : data.losses;
    if (awayW > homeW) hints.push(`历史心理优势：${away}历史${awayW}胜${homeW}负，历史数据对${home}构成压迫`);
    else if (homeW > awayW) hints.push(`历史优势在${home}（${homeW}胜${awayW}负），延续主导态势可能性大`);
    else hints.push(`历史交锋均势（各${homeW}胜），本场悬念较大`);
  }

  return hints.slice(0, 3); // 最多3条
}

// 战术标签判定
// 注意：控球率高 ≠ 高位压迫（gegenpressing），真正的高位压迫指标是PPDA
// 此处标签基于可用的静态数据（控球率+传球成功率+人员特点）做近似推断
function getTacticTag(teamName) {
  const t = TEAM_DATA[teamName];
  if (!t) return null;
  const pos = parseFloat(t.stats.pos);
  const pa = parseFloat(t.stats.pa);
  const gpg = parseFloat(t.stats.gpg);
  const cs = parseFloat(t.stats.cs);
  const hasSpeedFwd = (t.players||[]).some(p => {
    const spd = p.a && (p.a['速度'] || 0);
    return spd >= 92 && (p.pos.includes('锋') || p.pos.includes('翼'));
  });
  // 阵地控球型：高控球+高传球成功率（以传控为主要进攻手段）
  if (pos >= 58 && pa >= 88) return {tag:'传控型', cls:'tactic-pos'};
  // 低位防守型：低控球+低进球+高零封率（防守阵营，依靠防守+定位球）
  if (pos < 46 && gpg < 1.4 && cs >= 44) return {tag:'低位防守型', cls:'tactic-def'};
  // 高效反击型：不控球但进球效率高，有速度型锋线
  if (gpg >= 1.9 && hasSpeedFwd && pos < 54) return {tag:'快速反击型', cls:'tactic-cnt'};
  // 均衡型：其余情况
  return {tag:'均衡型', cls:'tactic-bal'};
}

// 获取球队的前2核心球员（评分最高）
function getCoreKPW(teamName) {
  const t = TEAM_DATA[teamName];
  if (!t || !t.players) return [];
  return [...t.players].sort((a,b)=>b.r-a.r).slice(0,2).map(p=>({name:p.name, r:p.r}));
}

// 战意因子：48队赛制下正确计算 MI
// 规则：每组4队，前2名出线，8个最佳第三名出线（共12组）
// 关键：第3轮前任何队都不会被数学淘汰，"生死战"只在第3轮触发
function getMI(teamName, groupKey) {
  const standings = calcStandings();
  const group = standings[groupKey];
  if (!group) return {mi:1.0, label:'', cls:''};
  const sorted = [...group].sort((a,b)=>b.pts!==a.pts?b.pts-a.pts:(b.gf-b.ga)-(a.gf-a.ga));
  const teamEntry = sorted.find(t => t.t.includes(teamName));
  if (!teamEntry) return {mi:1.0, label:'', cls:''};
  const rank = sorted.indexOf(teamEntry) + 1;
  const played = teamEntry.p;
  const pts = teamEntry.pts;

  // 已定出线：第3轮前，积分≥6且排名第1，数学上无法被超越
  if (played >= 2 && rank === 1 && pts >= 6)
    return {mi:0.8, label:'已定出线', cls:'mi-low'};

  // 平局出线：第3轮，排名前2且积分≥4，平局也能出线
  if (played >= 2 && rank <= 2 && pts >= 4)
    return {mi:0.9, label:'平局出线', cls:'mi-neutral'};

  // 第1、2轮一律不触发生死战——48队制下最后一轮前不存在数学淘汰
  if (played < 2) return {mi:1.0, label:'', cls:''};

  // 以下均为第3轮（played === 2）场景
  // 0分绝境：赢球也只得3分，能否靠最佳第三名出线存疑
  if (pts === 0)
    return {mi:1.35, label:'绝境生死', cls:'mi-high'};

  // 1分生死：赢球得4分有机会靠最佳第三名，但输/平基本出局
  if (rank > 2 && pts <= 1)
    return {mi:1.3, label:'生死战', cls:'mi-high'};

  // 3分悬念：排名第3，赢球得6分出线基本稳，平局4分仍有希望
  if (rank === 3 && pts === 3)
    return {mi:1.15, label:'出线悬念', cls:'mi-neutral'};

  return {mi:1.0, label:'', cls:''};
}

// 战术克制：传控型 vs 低位防守型（最典型的战术对立）
function getTacticClash(homeTactic, awayTactic) {
  if (!homeTactic || !awayTactic) return null;
  if (homeTactic.tag === '传控型' && awayTactic.tag === '低位防守型')
    return {side:'home', hint:'主队擅长传控，客队摆大巴——大比分爆发概率压缩，1-0/2-0最可能，需防1-1僵局'};
  if (awayTactic.tag === '传控型' && homeTactic.tag === '低位防守型')
    return {side:'away', hint:'客队传控，主队低位防守——主队依靠反击偷袭，平局概率上浮10-15%'};
  if (homeTactic.tag === '快速反击型' && awayTactic.tag === '传控型')
    return {side:'home', hint:'主队反击体系克制客队控球——速度型边锋是关键变量，客队防线高度危险'};
  if (awayTactic.tag === '快速反击型' && homeTactic.tag === '传控型')
    return {side:'away', hint:'客队反击速度克制主队控球——定位球+反击将是客队主要得分手段'};
  return null;
}

// 冷门预警指数
function getUpsetRisk(home, away, pred) {
  if (!pred) return null;
  const homeTactic = getTacticTag(home);
  const awayTactic = getTacticTag(away);
  const clash = getTacticClash(homeTactic, awayTactic);
  const favWin = Math.max(pred.win, pred.loss);
  const underdogWin = Math.min(pred.win, pred.loss);
  if (clash && underdogWin >= 15) return {level:'high', text:'🔥 高冷门风险', cls:'upset-high'};
  if (underdogWin >= 20 || (clash && underdogWin >= 10)) return {level:'mid', text:'⚠️ 中冷门风险', cls:'upset-mid'};
  return {level:'low', text:'✅ 正路走势', cls:'upset-low'};
}

// 调整后的战术强化Hints（V4：使用真实球员数值）
function buildEnhancedHints(home, away, pred, groupKey) {
  // V4: 优先使用基于TEAM_DATA真实数值的hints
  const v4Hints = buildV4Hints(home, away, pred);
  const hints = v4Hints.length ? v4Hints : [...(pred.hints || [])];

  const homeTactic = getTacticTag(home);
  const awayTactic = getTacticTag(away);
  const clash = getTacticClash(homeTactic, awayTactic);
  const homeMI = getMI(home, groupKey);
  const awayMI = getMI(away, groupKey);

  // 积分形势作为第一条插入（高优先级）
  if (homeMI.label || awayMI.label) {
    const miHint = [
      homeMI.label ? `${home}【${homeMI.label}】MI=${homeMI.mi}` : '',
      awayMI.label ? `${away}【${awayMI.label}】MI=${awayMI.mi}` : ''
    ].filter(Boolean).join('；');
    hints.unshift('📊 积分形势：' + miHint);
  }
  // 战术克制提示
  if (clash) hints.push('⚔️ 战术克制：' + clash.hint);

  return hints.slice(0, 4); // 最多4条
}


// ────────────────────────────────────────
// RENDER MATCH CARD
// ────────────────────────────────────────
function renderMatchCard(m) {
  const done = m.status === 'finished';
  const live = m.status === 'live';
  const pr = getPred(m.home, m.away);
  const pred = pr?.pred;
  const rev = pr?.rev;

  const win = pred ? (rev ? pred.loss : pred.win) : null;
  const draw = pred ? pred.draw : null;
  const loss = pred ? (rev ? pred.win : pred.loss) : null;
  const other = pred ? (100 - win - draw - loss) : 0;

  // KPW 伤停扣减逻辑
  // 检测双方核心球员是否有伤停状态（status: 'injured'）
  function getKPWDeduction(teamName, baseWin, baseDraw) {
    const t = TEAM_DATA[teamName];
    if (!t || !t.players) return { win: baseWin, draw: baseDraw, alert: null };
    const sortedByRating = [...t.players].sort((a,b)=>b.r-a.r);
    const coreNames = sortedByRating.slice(0,2).map(p=>p.name);
    const injuredCores = t.players.filter(p =>
      coreNames.includes(p.name) && p.status === 'injured'
    );
    if (injuredCores.length === 0) return { win: baseWin, draw: baseDraw, alert: null };
    const deduction = Math.round(baseWin * 0.15);
    const newWin = baseWin - deduction;
    const newDraw = baseDraw + Math.round(deduction * 0.6);
    const alert = `⚠️ KPW预警：${teamName}【${injuredCores.map(p=>p.name).join('、')}】伤停，触发15%战力扣减（胜率 ${baseWin}% → ${newWin}%）`;
    return { win: newWin, draw: newDraw, alert };
  }

  const homeTeamName = rev ? m.away : m.home;
  const awayTeamName = rev ? m.home : m.away;
  const homeKPW = !done && !live && pred ? getKPWDeduction(homeTeamName, win, draw) : { win, draw, alert: null };
  const awayKPW = !done && !live && pred ? getKPWDeduction(awayTeamName, loss, draw) : { win: loss, draw, alert: null };
  const adjWin = homeKPW.win;
  const adjDraw = Math.round((homeKPW.draw + awayKPW.draw) / 2);
  const adjLoss = awayKPW.win;
  const kpwAlertHTML = [homeKPW.alert, awayKPW.alert].filter(Boolean).map(a =>
    `<div class="kpw-alert"><span class="kpw-icon">🚨</span><span>${a}</span></div>`
  ).join('');

  const hasPenC = done && m.home_pen != null && m.away_pen != null;
  const scoreLbl = live ? '⚡比赛中' : (hasPenC ? '点球 '+m.home_pen+'-'+m.away_pen : (m.aet ? '加时' : '最终'));
  const scoreHTML = done || live
    ? `<div class="score-num">${m.home_score ?? '–'}<span style="color:var(--t3);margin:0 2px">:</span>${m.away_score ?? '–'}</div><div class="score-lbl">${scoreLbl}</div>`
    : `<div class="score-vs">VS</div><div class="score-lbl">${m.bjt ? m.bjt + ' BJT' : ''}</div>`;

  const spClass = done ? 'sp-done' : live ? 'sp-live' : 'sp-up';
  const isUpset = m.upset === true;
  const spText = done ? '已完赛' : live ? '⚡进行中' : '即将开赛';
  const upsetTag = (done && isUpset) ? '<span class="upset-result-tag">💥 爆冷</span>' : '';

  const homeKey = Object.keys(TEAM_DATA).find(k => m.home.includes(k));
  const awayKey = Object.keys(TEAM_DATA).find(k => m.away.includes(k));

  // 战术标签
  const homeTactic = getTacticTag(m.home);
  const awayTactic = getTacticTag(m.away);
  const homeTacHTML = homeTactic ? `<span class="tactic-tag ${homeTactic.cls}">${homeTactic.tag}</span>` : '';
  const awayTacHTML = awayTactic ? `<span class="tactic-tag ${awayTactic.cls}">${awayTactic.tag}</span>` : '';

  // 冷门预警
  const groupKey = m.group ? m.group + '组' : '';
  const upsetRisk = !done && !live && pred ? getUpsetRisk(m.home, m.away, pred) : null;
  const upsetHTML = upsetRisk ? `<div class="upset-row">
    <span class="upset-label">冷门预警指数 Upset Risk</span>
    <span class="upset-badge ${upsetRisk.cls}">${upsetRisk.text}</span>
  </div>` : '';

  let predHTML = '';
  if (!done && !live && pred) {
    // 战意因子
    const homeMI = getMI(m.home, groupKey);
    const awayMI = getMI(m.away, groupKey);
    const miHTML = (homeMI.label || awayMI.label) ? `
    <div style="display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap">
      ${homeMI.label ? `<span style="font-size:10px;color:var(--t2)">${m.home} <span class="mi-badge ${homeMI.cls}">【${homeMI.label}】MI=${homeMI.mi}</span></span>` : ''}
      ${awayMI.label ? `<span style="font-size:10px;color:var(--t2)">${m.away} <span class="mi-badge ${awayMI.cls}">【${awayMI.label}】MI=${awayMI.mi}</span></span>` : ''}
    </div>` : '';

    // 增强Hints
    const enhancedHints = buildEnhancedHints(m.home, m.away, pred, groupKey);

    // 比分进度条：兼容两种scores格式
    // PREDS格式: [{s:'3-0', p:28}, ...]（带概率）
    // JSON格式:  {main:[], secondary:[], upset:[]}（纯字符串，无概率）
    let normalizedScores;
    if (Array.isArray(pred.scores)) {
      normalizedScores = [...pred.scores].sort((a,b) => b.p - a.p);
    } else if (pred.scores && typeof pred.scores === 'object') {
      const slots = [
        ...(pred.scores.main || []).map((s,i) => ({ s, p: 30 - i*5 })),
        ...(pred.scores.secondary || []).map((s,i) => ({ s, p: 18 - i*4 })),
        ...(pred.scores.upset || []).map(s => ({ s, p: 6 })),
      ];
      normalizedScores = slots;
    } else {
      normalizedScores = [];
    }
    const maxP = normalizedScores[0]?.p || 1;
    const scoreBarsHTML = normalizedScores.length ? `<div class="score-pred-bars">
      ${normalizedScores.map((s,i) => `<div class="spb-row">
        <div class="spb-label">${s.s}</div>
        <div class="spb-track">
          <div class="spb-fill ${i===0?'top-fill':''}" style="width:${Math.round(s.p/maxP*100)}%"></div>
        </div>
        <div class="spb-pct">${s.p}%</div>
      </div>`).join('')}
    </div>` : '';

    predHTML = `
    <div class="pred-wrap">
      ${kpwAlertHTML}
      ${upsetHTML}
      ${miHTML}
      <div class="pred-hd">AI 胜平负预测</div>
      <div class="pred-bars">
        <div class="pb-item">
          <div class="pb-label">${m.home} 胜</div>
          <div class="pb-track"><div class="pb-fill fill-w" style="width:${adjWin}%"></div></div>
          <div class="pb-val tv-w">${adjWin}%</div>
        </div>
        <div class="pb-item">
          <div class="pb-label">平局</div>
          <div class="pb-track"><div class="pb-fill fill-d" style="width:${adjDraw}%"></div></div>
          <div class="pb-val tv-d">${adjDraw}%</div>
        </div>
        <div class="pb-item">
          <div class="pb-label">${m.away} 胜</div>
          <div class="pb-track"><div class="pb-fill fill-l" style="width:${adjLoss}%"></div></div>
          <div class="pb-val tv-l">${adjLoss}%</div>
        </div>
      </div>
      ${other > 0 ? `<div class="other-prob">加时/延伸概率：${other}%</div>` : ''}
      <div style="font-size:9px;color:var(--t3);margin-bottom:5px">比分预测概率</div>
      ${scoreBarsHTML}
      <div class="insights">
        ${enhancedHints.map(h => `<div class="insight">${h}</div>`).join('')}
      </div>
      ${(() => {
        const rFlags = getRiskFlags(m.home, m.away, m.date);
        return rFlags.length ? `<div class="risk-flags">${rFlags.map(f=>`<span class="risk-flag ${f.cls}">${f.text}</span>`).join('')}</div>` : '';
      })()}
      ${renderH2H(m.home, m.away)}
    </div>`;
  }

  return `<div class="mc" id="mc-${m.id}">
    <div class="mc-inner">
      <div class="mc-top">
        <div class="mc-meta">
          <span class="gpill">${m.group ? m.group+'组' : (m.stage||'淘汰赛')}</span>
          ${!done && !live && m.bjt ? `<span class="tpill">${m.bjt} BJT</span>` : ''}
          ${homeTacHTML}${awayTacHTML}
        </div>
        <span class="spill ${spClass}">${spText}</span>${upsetTag}
      </div>
      <div class="teams">
        <div class="team" ${homeKey ? `onclick="showTeam('${homeKey}', '${awayKey || ''}')"` : ''}>
          <div class="team-fn"><span class="tf">${FLAGS[m.home]||'🏳️'}</span><span class="tn">${m.home}</span></div>
          <div class="tr">${RANKS[m.home] ? 'FIFA #'+RANKS[m.home] : ''}</div>
        </div>
        <div class="score-box">${scoreHTML}</div>
        <div class="team r" ${awayKey ? `onclick="showTeam('${awayKey}', '${homeKey || ''}')"` : ''}>
          <div class="team-fn"><span class="tf">${FLAGS[m.away]||'🏳️'}</span><span class="tn">${m.away}</span></div>
          <div class="tr">${RANKS[m.away] ? 'FIFA #'+RANKS[m.away] : ''}</div>
        </div>
      </div>
      ${predHTML}
    </div>
  </div>`;
}

// ────────────────────────────────────────
// STANDINGS（动态计算，不再硬编码）
// ────────────────────────────────────────

// 从 matchesData 里所有 status==='finished' 的比赛动态计算各组积分榜
// 返回结构与原 STANDINGS 完全一致：{ 'A组': [{t, p, w, d, l, gf, ga, pts}, ...], ... }
function calcStandings() {
  const result = {};

  // 先用 FALLBACK_MATCHES 里所有比赛初始化每组每支队伍为 0 分
  // 保证即使一场未打也能显示出来（且保留 flag emoji）
  const allMatches = (matchesData && matchesData.length ? matchesData : FALLBACK_MATCHES);

  allMatches.forEach(m => {
    if (!m.group) return;
    const gKey = m.group + '组';
    if (!result[gKey]) result[gKey] = {};

    [m.home, m.away].forEach(teamName => {
      if (!result[gKey][teamName]) {
        const flag = FLAGS[teamName] || '';
        result[gKey][teamName] = { t: flag ? flag + ' ' + teamName : teamName, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0 };
      }
    });
  });

  // 遍历所有已完赛比赛，累计积分
  allMatches.filter(m => m.status === 'finished').forEach(m => {
    if (!m.group) return;
    const gKey = m.group + '组';
    const hs = m.home_score ?? null;
    const as_ = m.away_score ?? null;
    if (hs === null || as_ === null) return;

    const home = result[gKey]?.[m.home];
    const away = result[gKey]?.[m.away];
    if (!home || !away) return;

    home.p++; away.p++;
    home.gf += hs; home.ga += as_;
    away.gf += as_; away.ga += hs;

    if (hs > as_) {
      home.w++; home.pts += 3;
      away.l++;
    } else if (hs < as_) {
      away.w++; away.pts += 3;
      home.l++;
    } else {
      home.d++; home.pts += 1;
      away.d++; away.pts += 1;
    }
  });

  // 把每组的对象转成数组，按积分/净胜球排序
  const final = {};
  Object.keys(result).sort().forEach(gKey => {
    final[gKey] = Object.values(result[gKey])
      .sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : (b.gf - b.ga) - (a.gf - a.ga));
  });
  return final;
}

function renderStandings() {
  const STANDINGS = calcStandings();
  document.getElementById('standings-content').innerHTML = Object.keys(STANDINGS).map(g => {
    const ts = [...STANDINGS[g]].sort((a,b) => b.pts!==a.pts ? b.pts-a.pts : (b.gf-b.ga)-(a.gf-a.ga));
    return `<div class="st-card">
      <div class="st-hd">${g}</div>
      <table class="st-table">
        <thead><tr><th>球队</th><th>场</th><th>W</th><th>D</th><th>L</th><th>±</th><th>分</th></tr></thead>

}

function renderResults() {
  const done = matchesData.filter(m => m.status === 'finished');
  const g = groupBy([...done].sort((a,b) => b.date.localeCompare(a.date)), 'date');
  document.getElementById('results-content').innerHTML = Object.keys(g).map(d => `
    <div class="day-hd"><span class="day-hd-label">${fmtDate(d)}</span><span class="day-hd-count">${g[d].length}场</span><div class="day-hd-line"></div></div>
    ${g[d].map(m => renderMatchCard(m)).join('')}
  `).join('');
}

function renderTeamsGrid() {
  const byGroup = {};
  Object.keys(TEAM_DATA).forEach(k => {
    const t = TEAM_DATA[k];
    const g = t.group + '组';
    if (!byGroup[g]) byGroup[g] = [];
    byGroup[g].push({ key: k, t });
  });

  document.getElementById('teams-content').innerHTML =
    `<div style="font-size:11px;color:var(--t2);margin-bottom:14px">点击球队查看详细球员数据与能力六边形</div>` +
    Object.keys(byGroup).sort().map(g => `
      <div style="margin-bottom:18px">
        <div style="font-size:11px;font-weight:600;color:var(--ac2);margin-bottom:8px;padding:5px 10px;background:rgba(124,111,255,.07);border-radius:6px;display:inline-block">${g}</div>
        <div class="teams-grid">
          ${byGroup[g].map(({ key, t }) => `
            <div class="tg-card" onclick="showTeam('${key}')">
              <div class="tg-flag">${t.flag}</div>
              <div class="tg-name">${key}</div>
              <div class="tg-rank">FIFA #${t.rank}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('');
}

function findKnockoutOpponent(key) {
  const pending = (matchesData || [])
    .filter(m => m.stage && m.status !== 'finished' && (m.home === key || m.away === key))
    .sort((a, b) => (a.date + (a.bjt||'')).localeCompare(b.date + (b.bjt||'')))[0];
  if (pending) return pending.home === key ? pending.away : pending.home;

  const latest = (matchesData || [])
    .filter(m => m.stage && (m.home === key || m.away === key))
    .sort((a, b) => (b.date + (b.bjt||'')).localeCompare(a.date + (a.bjt||'')))[0];
  return latest ? (latest.home === key ? latest.away : latest.home) : null;
}

function showTeam(key, opponentKey = '') {
  const t = TEAM_DATA[key];
  if (!t) { alert('该队详细数据即将上线'); return; }
  const contextOpponentKey = opponentKey && TEAM_DATA[opponentKey] ? opponentKey : findKnockoutOpponent(key);
  radarInstances.forEach(c => { try { c.destroy(); } catch(e){} });
  radarInstances = [];
  window._currentPlayerRadarData = [];

  showPage('team', null);

  const formHTML = (t.form || []).map(r => {
    const bg = r==='W'?'var(--green)':r==='D'?'var(--amber)':'var(--red)';
    return `<span class="fd" style="background:${bg}">${r}</span>`;
  }).join('');

  // 找出核心（评分最高2名）和守护者（防守型最高1名）
  const sortedByRating = [...(t.players||[])].sort((a,b)=>b.r-a.r);
  const coreNames = sortedByRating.slice(0,2).map(p=>p.name);
  const anchorNames = [...(t.players||[])].filter(p=>{
    const attrs = Object.keys(p.a||{});
    return attrs.some(k=>['防守','拦截','扑救'].includes(k) && p.a[k]>=85);
  }).slice(0,1).map(p=>p.name);

  // 战术软肋分析（多维度差异化诊断）
  const stats = t.stats;
  const gpg = parseFloat(stats.gpg);
  const pos = parseFloat(stats.pos);
  const pa = parseFloat(stats.pa);
  const cs = parseFloat(stats.cs);  // 零封率，如 "52%" → 52

  // 收集所有命中的问题，取最严重的输出
  const issues = [];

  // 进攻端
  if (gpg < 1.2) issues.push({ sev: 4, text: '进攻端严重匮乏，场均不足1.2球，终结能力是最大短板' });
  else if (gpg < 1.5) issues.push({ sev: 3, text: '进攻效率偏低，缺乏高质量终结者，依赖定位球或偷袭得分' });
  else if (gpg < 1.8 && pos > 55) issues.push({ sev: 2, text: '控球占优但转化率偏低，有"华而不实"风险，易被反击克制' });

  // 防守端
  if (cs < 35) issues.push({ sev: 4, text: '防线漏洞明显，零封率仅' + cs + '%，高失球风险影响晋级稳定性' });
  else if (cs < 42) issues.push({ sev: 2, text: '防守稳定性不足，零封率' + cs + '%，中场失位时防线压力大' });

  // 传控质量
  if (pa < 79) issues.push({ sev: 4, text: '传球成功率仅' + pa + '%，高位逼抢下极易失误，不适应快节奏对抗' });
  else if (pa < 82) issues.push({ sev: 2, text: '传球精度一般（' + pa + '%），面对强队逼抢时组织易失灵' });

  // 控球率
  if (pos < 44) issues.push({ sev: 3, text: '控球率仅' + pos + '%，长期被动承压，体能消耗大，末段易崩' });
  else if (pos < 48 && cs < 45) issues.push({ sev: 2, text: '低控球+低零封组合，防守反击打法稳定性依赖单场发挥' });

  // 球员深度（球员数量少于3人视为轮换不足）
  const playerCount = (t.players || []).length;
  if (playerCount <= 1) issues.push({ sev: 3, text: '名单深度严重不足，核心伤停将导致战力断崖式下滑' });
  else if (playerCount <= 2) issues.push({ sev: 2, text: '轮换厚度薄，连续赛事体能管理是隐患' });

  // 球员评分方差（高评分球员依赖性）
  const ratings = (t.players || []).map(p => p.r);
  if (ratings.length >= 2) {
    const maxR = Math.max(...ratings);
    const avgR = ratings.reduce((s, r) => s + r, 0) / ratings.length;
    if (maxR - avgR > 0.8) issues.push({ sev: 2, text: '星味依赖症明显，最强球员评分' + maxR + '，与其他球员差距过大，核心被针对则体系失灵' });
  }

  // 取最高严重度的问题，同等严重度取第一个
  let weakness = '';
  if (issues.length === 0) {
    // 真正均衡：找相对最弱的一项做差异化描述
    const dims = [
      { name: '零封率', score: cs, low: 42, high: 55, unit: '%', hint: '防守稳定性是相对短板，连续高强度比赛中防线容错率需关注' },
      { name: '场均进球', score: gpg * 10, low: 15, high: 28, unit: '', hint: '进攻端是相对弱项，依赖整体体系而非个人爆发力' },
      { name: '控球率', score: pos, low: 48, high: 62, unit: '%', hint: '控球偏低，面对高位逼抢的球队可能节奏被打乱' },
      { name: '传球成功率', score: pa, low: 82, high: 93, unit: '%', hint: '传球精度有提升空间，高压下失误风险不可忽视' },
    ];
    // 归一化后找最低的
    const weakDim = dims.reduce((worst, d) => {
      const norm = (d.score - d.low) / (d.high - d.low);
      const wNorm = (worst.score - worst.low) / (worst.high - worst.low);
      return norm < wNorm ? d : worst;
    });
    weakness = `整体均衡（控球${pos}%·传球${pa}%·场均${gpg}球·零封${cs}%）；相对而言${weakDim.name}是最薄弱维度，${weakDim.hint}`;
  } else {
    issues.sort((a, b) => b.sev - a.sev);
    weakness = issues[0].text;
    // 如果有次级问题，附加说明
    if (issues.length > 1 && issues[1].sev >= 2) {
      weakness += '；次要隐患：' + issues[1].text;
    }
  }

  const playersHTML = (t.players || []).map((p, i) => {
    const akeys = Object.keys(p.a || {});
    const isCore = coreNames.includes(p.name);
    const isAnchor = anchorNames.includes(p.name);
    const badgesHTML = `<div class="player-badges">
      ${isCore ? '<span class="pbadge pbadge-key">战术核心 🔑</span>' : ''}
      ${isAnchor ? '<span class="pbadge pbadge-anchor">定海神针 🛡️</span>' : ''}
      ${isCore ? '<span class="pbadge pbadge-kpw">KPW=15%</span>' : ''}
    </div>`;

    // 根据位置+数值自动生成球员个人场上职责（不再复读全队软肋）
    const topAttr = akeys.sort((a,b)=>p.a[b]-p.a[a]).slice(0,2).join('、');
    let playerRole = '';
    const pos2 = p.pos;
    if (pos2.includes('门将')) {
      playerRole = `指挥后防线、负责空中球处理，核心能力：${topAttr}`;
    } else if (pos2.includes('后卫') || pos2.includes('后腰')) {
      const hasInterception = p.a['拦截'] || p.a['防守'];
      if (hasInterception >= 88) playerRole = `拖后覆盖+拦截出球，是本队防守体系锚点，核心能力：${topAttr}`;
      else playerRole = `参与控球推进，兼顾防守保护，核心能力：${topAttr}`;
    } else if (pos2.includes('中场') || pos2.includes('进攻中场')) {
      const vision = p.a['视野'] || p.a['传球'] || 0;
      if (vision >= 90) playerRole = `组织核心，负责节奏控制与直塞创造机会，核心能力：${topAttr}`;
      else playerRole = `跑动覆盖+过渡衔接，联络前后场的引擎，核心能力：${topAttr}`;
    } else if (pos2.includes('翼') || pos2.includes('边锋')) {
      playerRole = `宽度拉扯+边路突破，以速度和过人制造混乱，核心能力：${topAttr}`;
    } else if (pos2.includes('锋') || pos2.includes('中锋')) {
      playerRole = `终结者角色，射门+跑位是首要职责，核心能力：${topAttr}`;
    } else {
      playerRole = `场上核心，核心能力：${topAttr}`;
    }

    return `
    <div class="player-card" onclick="togglePD(${i})">
      <div class="pnum">${p.n}</div>
      <div class="pinfo">
        <div class="pname">${p.name}</div>
        <div class="ppos">${p.pos} · ${p.club}</div>
        ${isCore || isAnchor ? badgesHTML : ''}
      </div>
      <div class="prating">${p.r}</div>
    </div>
    <div class="player-detail" id="pd-${i}">
      <div style="font-size:9px;color:var(--t3);margin-bottom:8px">24-25赛季数据 · 参考 FBref / WhoScored</div>
      <div style="font-size:11px;color:var(--cyan);margin-bottom:10px;padding:6px 10px;background:rgba(34,211,238,0.07);border-radius:6px;border-left:2px solid var(--cyan)">
        🎯 场上职责：${playerRole}
      </div>
      <div class="attr-grid">
        ${akeys.map(k => `<div class="attr-item">
          <div class="attr-val">${p.a[k]}</div>
          <div class="attr-bar"><div class="attr-fill" style="width:${p.a[k]}%"></div></div>
          <div class="attr-name">${k}</div>
        </div>`).join('')}
      </div>
      <div class="radar-wrap"><canvas id="radar-${i}" role="img" aria-label="${p.name}能力雷达图">${p.name}</canvas></div>
    </div>`;
  }).join('');

  document.getElementById('team-detail').innerHTML = `
    <div class="back-btn" onclick="showPage('teams', Array.from(document.querySelectorAll('.nav-tab')).find(t => (t.getAttribute('onclick')||'').includes("'teams'")))">← 全部球队</div>
    <div class="team-hd">
      <div class="team-flag-lg">${t.flag}</div>
      <div>
        <div class="team-hd-name">${t.name}</div>
        <div class="team-hd-sub">${t.group}组 · FIFA #${t.rank} · 教练：${t.coach}</div>
        <div class="form-dots">${formHTML}<span style="font-size:10px;color:var(--t3);margin-left:6px">近5场</span></div>
      </div>
    </div>
    <div class="tstats">
      <div class="tsc"><div class="tsc-l">世界杯参赛</div><div class="tsc-v" style="color:var(--ac2)">${t.apps}</div></div>
      <div class="tsc"><div class="tsc-l">历史最佳</div><div class="tsc-v" style="font-size:13px;margin-top:4px">${t.best}</div></div>
      <div class="tsc"><div class="tsc-l">场均进球</div><div class="tsc-v" style="color:var(--green)">${t.stats.gpg}</div></div>
      <div class="tsc"><div class="tsc-l">零封率</div><div class="tsc-v">${t.stats.cs}</div></div>
      <div class="tsc"><div class="tsc-l">平均控球</div><div class="tsc-v" style="color:var(--cyan)">${t.stats.pos}</div></div>
      <div class="tsc"><div class="tsc-l">传球成功率</div><div class="tsc-v">${t.stats.pa}</div></div>
    </div>
    <div class="compare-radar-wrap">
      <div class="compare-radar-title">${contextOpponentKey ? '与当前淘汰赛对手对比（雷达）' : '与组内强敌对比（雷达）'}</div>
      <canvas id="compare-radar"></canvas>
      <div class="compare-legend" id="compare-legend"></div>
    </div>
    <div class="sec-title">战术诊断</div>
    <div class="tactic-weakness" style="margin-bottom:16px"><strong>⚠️ 整体短板：</strong>${weakness}</div>
    <div class="sec-title">核心球员 · 点击展开能力雷达与个人职责</div>
    ${playersHTML || '<div style="color:var(--t3);padding:20px">球员数据整理中</div>'}
  `;

  setTimeout(() => {
    // 对比雷达图：优先使用当前比赛/淘汰赛对手；没有上下文时退回组内FIFA排名最高对手。
    const rivalTeamKey = contextOpponentKey || Object.keys(TEAM_DATA)
      .filter(k => k !== key && TEAM_DATA[k].group === t.group && TEAM_DATA[k].stats)
      .sort((a, b) => (TEAM_DATA[a].rank || 999) - (TEAM_DATA[b].rank || 999))[0] || null;
    const rival = rivalTeamKey ? TEAM_DATA[rivalTeamKey] : null;

    if (rival) {
      const formPts = (form) => form.reduce((s,r)=>s+(r==='W'?3:r==='D'?1:0),0);
      const avgRating = (players) => players.length ? (players.reduce((s,p)=>s+p.r,0)/players.length).toFixed(1) : 7.5;
      const labels = ['控球率','传球成功率','场均进球','零封率','近5场积分','球员均评分'];
      const norm = (v, min, max) => Math.max(0, Math.min(100, (v-min)/(max-min)*100));
      const myData = [
        norm(parseFloat(t.stats.pos),40,65),
        norm(parseFloat(t.stats.pa),74,95),
        norm(parseFloat(t.stats.gpg),0.8,3.5),
        norm(parseFloat(t.stats.cs),20,60),
        norm(formPts(t.form||[]),0,15),
        norm(parseFloat(avgRating(t.players||[])),7.0,9.5)
      ];
      const rivalData = [
        norm(parseFloat(rival.stats.pos),40,65),
        norm(parseFloat(rival.stats.pa),74,95),
        norm(parseFloat(rival.stats.gpg),0.8,3.5),
        norm(parseFloat(rival.stats.cs),20,60),
        norm(formPts(rival.form||[]),0,15),
        norm(parseFloat(avgRating(rival.players||[])),7.0,9.5)
      ];
      const cCtx = document.getElementById('compare-radar');
      if (cCtx) {
        cCtx.width = 280;
        cCtx.height = 220;
        cCtx.style.display = 'block';
        cCtx.style.margin = '0 auto';
        radarInstances.push(new Chart(cCtx, {
          type: 'radar',
          data: { labels, datasets: [

function togglePD(i) {
  const el = document.getElementById(`pd-${i}`);
  if (!el) return;
  el.classList.toggle('open');
  if (el.classList.contains('open')) {
    const ctx = document.getElementById(`radar-${i}`);
    if (ctx && !ctx.dataset.radarDone) {
      ctx.dataset.radarDone = '1';
      const playerData = window._currentPlayerRadarData?.[i];
      if (playerData) {
        const { keys, vals, name } = playerData;
        ctx.width = 220;
        ctx.height = 220;
        ctx.style.display = 'block';
        ctx.style.margin = '0 auto';

// ────────────────────────────────────────
// 晋级路线图（首页）：横向树状 bracket，每阶段一列，配对连线汇入下一轮
// 数据来自 matchesData 中带 stage 字段的淘汰赛，未确定的槽位显示「待定」
// ────────────────────────────────────────
function bracketCard(m) {
  if (!m) {
    return '<div class="bk-match bk-tbd"><div class="bk-tm"><span class="bk-nm">待定</span></div>'
      + '<div class="bk-tm"><span class="bk-nm">待定</span></div>'
      + '<div class="bk-mt">赛程待定</div></div>';
  }
  const done = m.status === 'finished' && m.home_score != null && m.away_score != null;
  const live = m.status === 'live';
  const dt = m.date ? new Date(m.date + 'T12:00:00') : null;
  const md = dt ? (dt.getMonth()+1) + '/' + dt.getDate() : '';
  const hasPen = done && m.home_pen != null && m.away_pen != null;
  // 晋级方：有点球按点球，否则按法定比分
  const hw = done && (hasPen ? m.home_pen > m.away_pen : m.home_score > m.away_score);
  const aw = done && (hasPen ? m.away_pen > m.home_pen : m.away_score > m.home_score);
  const penH = hasPen ? '<span class="bk-pen">(' + m.home_pen + ')</span>' : '';
  const penA = hasPen ? '<span class="bk-pen">(' + m.away_pen + ')</span>' : '';
  const hs = done ? '<span class="bk-sc">' + m.home_score + penH + '</span>' : '';
  const as = done ? '<span class="bk-sc">' + m.away_score + penA + '</span>' : '';
  let foot;
  if (done && hasPen) foot = '<div class="bk-mt">' + md + ' · 点球决出</div>';
  else if (done && m.aet) foot = '<div class="bk-mt">' + md + ' · 加时决出</div>';
  else if (done) foot = '<div class="bk-mt">' + md + ' 已结束</div>';
  else if (live) foot = '<div class="bk-mt bk-mt-live">' + md + ' 进行中</div>';
  else if (m.synthetic) foot = '<div class="bk-mt">' + (md ? md + (m.bjt ? ' ' + m.bjt + ' BJT' : ' 待定') : '赛程待定') + '</div>';
  else foot = '<div class="bk-mt">' + md + (m.bjt ? ' ' + m.bjt + ' BJT' : ' 待定') + '</div>';
  const isEmptySynthetic = m.synthetic && m.home === '待定' && m.away === '待定';
  const click = m.id
    ? ' onclick="goToMatch(' + m.id + ', \'' + m.date + '\')"'
    : (m.synthetic && !isEmptySynthetic ? ' onclick="goToDerivedMatch(\'' + m.home + '\', \'' + m.away + '\', \'' + m.stage + '\')"' : '');
  return '<div class="bk-match' + (done ? ' bk-done' : '') + (isEmptySynthetic ? ' bk-tbd' : '') + '"' + click + '>'
    + '<div class="bk-tm' + (hw ? ' bk-w' : '') + '"><span class="bk-nm">' + (FLAGS[m.home]||'🏳️') + ' ' + m.home + '</span>' + hs + '</div>'
    + '<div class="bk-tm' + (aw ? ' bk-w' : '') + '"><span class="bk-nm">' + (FLAGS[m.away]||'🏳️') + ' ' + m.away + '</span>' + as + '</div>'
    + foot
    + '</div>';
}

function getMatchWinner(m) {
  if (!m || m.status !== 'finished' || m.home_score == null || m.away_score == null) return null;
  if (m.home_pen != null && m.away_pen != null) {
    if (m.home_pen > m.away_pen) return m.home;
    if (m.away_pen > m.home_pen) return m.away;
    return null;
  }
  if (m.home_score > m.away_score) return m.home;
  if (m.away_score > m.home_score) return m.away;
  return null;
}

function makeDerivedBracketMatch(stageKey, home, away, index, slot) {
  return {
    synthetic: true,
    id: null,
    stage: stageKey,
    group: null,
    home: home || slot?.home || '待定',
    away: away || slot?.away || '待定',
    home_score: null,
    away_score: null,
    status: 'upcoming',
    date: slot?.date || '',
    bjt: slot?.bjt || '',
    bracket_index: index,
  };
}

function fillDerivedStageSlots(stageSlots, prevSlots, stageKey, count) {
  const out = [];
  for (let i = 0; i < count; i++) {
    const slot = stageSlots[i];
    if (slot && slot.status === 'finished') {
      out.push(slot);
      continue;
    }
    const a = getMatchWinner(prevSlots[i * 2]);
    const b = getMatchWinner(prevSlots[i * 2 + 1]);
    if (!a && !b && slot) {
      out.push(slot);
      continue;
    }
    out.push(makeDerivedBracketMatch(stageKey, a, b, i, slot));
  }
  return out;
}

function orderStageMatches(matches, stageKey) {
  const order = {
    // 1/16 must follow the knockout slot graph, not chronological kickoff order.
    '1/16决赛': [75,78,73,76,74,77,79,80,83,84,82,81,86,88,85,87],
    '1/8决赛': [89,90,91,92,93,94,95,96],
    '1/4决赛': [97,98,99,100],
    '半决赛': [101,102],
    '决赛': [104],
  }[stageKey];
  if (!order) {
    return matches.sort((a, b) => (a.date + (a.bjt||'')).localeCompare(b.date + (b.bjt||'')));
  }
  const byId = new Map(matches.map(m => [m.id, m]));
  const ordered = order.map(id => byId.get(id));
  matches
    .filter(m => !order.includes(m.id))
    .sort((a, b) => (a.date + (a.bjt||'')).localeCompare(b.date + (b.bjt||'')))
    .forEach(m => ordered.push(m));
  return ordered;
}

function renderBracket() {
  // 各阶段总场数与标签（决赛居中，两侧各占一半）
  const STAGES = [
    { key: '1/16决赛', h1: '32强', h2: '1/16决赛', count: 16 },
    { key: '1/8决赛',  h1: '16强', h2: '1/8决赛',  count: 8 },
    { key: '1/4决赛',  h1: '8强',  h2: '1/4决赛',  count: 4 },
    { key: '半决赛',   h1: '4强',  h2: '半决赛',   count: 2 },
    { key: '决赛',     h1: '决赛', h2: '冠军之战', count: 1 },
  ];
  const ko = (matchesData || []).filter(m => m.stage);
  const officialStageMs = STAGES.map(st => orderStageMatches(ko.filter(m => m.stage === st.key), st.key).slice(0, st.count));
  const stageMs = [];
  stageMs[0] = officialStageMs[0];
  for (let si = 1; si < STAGES.length; si++) {
    stageMs[si] = fillDerivedStageSlots(officialStageMs[si], stageMs[si - 1], STAGES[si].key, STAGES[si].count);
  }

  // 把一个阶段的全部对阵按顺序分到左右两个半区
  function half(si, side) {
    const all = stageMs[si], per = STAGES[si].count / 2;
    const src = side === 'L' ? all.slice(0, per) : all.slice(per, STAGES[si].count);
    const out = [];
    for (let i = 0; i < per; i++) out.push(src[i]);  // 不足处自动为 undefined → 待定
    return out;
  }
  // 渲染一个配对列（2场及以上 → 成对连线）
  function pairCol(si, side) {
    const slots = half(si, side), rev = side === 'R';
    let h = '<div class="bk-round">';
    for (let p = 0; p < slots.length / 2; p++) {
      h += '<div class="bk-pair' + (rev ? ' bk-rev' : '') + '">'
        + bracketCard(slots[p*2]) + bracketCard(slots[p*2+1]) + '</div>';
    }
    return h + '</div>';
  }
  // 渲染半决赛单场列（直线汇入决赛）
  function semiCol(side) {
    const m = half(3, side)[0];
    return '<div class="bk-round ' + (side === 'L' ? 'bk-feedR' : 'bk-feedL') + '">' + bracketCard(m) + '</div>';
  }

  // 表头：32强 16强 8强 4强 | 决赛🏆 | 4强 8强 16强 32强
  const headCells = [];
  for (let si = 0; si < 4; si++) headCells.push({ h1: STAGES[si].h1, h2: STAGES[si].h2 });
  const cellHTML = c => '<div class="bk-hcell"><div class="bk-h1">' + c.h1 + '</div><div class="bk-h2">' + c.h2 + '</div></div>';
  let head = '<div class="bk-head">';
  headCells.forEach(c => head += cellHTML(c));
  const koDone = ko.length;
  head += '<div class="bk-hcell bk-hc-center"><div class="bk-h1">决赛 🏆</div><div class="bk-h2">冠军之战 · 已录入' + koDone + '场</div></div>';
  headCells.slice().reverse().forEach(c => head += cellHTML(c));
  head += '</div>';

  // 冠军
  const finalM = stageMs[4][0];
  let champ = null;
  if (finalM && finalM.status === 'finished' && finalM.home_score != null && finalM.away_score != null) {
    const fp = finalM.home_pen != null && finalM.away_pen != null;
    const fh = fp ? finalM.home_pen : finalM.home_score, fa = fp ? finalM.away_pen : finalM.away_score;
    if (fh > fa) champ = finalM.home;
    else if (fa > fh) champ = finalM.away;
  }
  const champHTML = '<div class="bk-champion">'
    + (champ
        ? '<div class="bk-champ-flag">' + (FLAGS[champ]||'🏆') + '</div><div class="bk-champ-name">' + champ + '</div><div class="bk-champ-tag">世界杯冠军</div>'
        : '<div class="bk-champ-flag">🏆</div><div class="bk-champ-name">待定</div><div class="bk-champ-tag">冠军虚位以待</div>')
    + '</div>';

  // 列：左半区(32→16→8→4) | 中央(决赛+冠军) | 右半区(4→8→16→32)
  let body = '<div class="bk">';
  body += pairCol(0, 'L') + pairCol(1, 'L') + pairCol(2, 'L') + semiCol('L');
  body += '<div class="bk-round bk-center">' + bracketCard(finalM) + champHTML + '</div>';
  body += semiCol('R') + pairCol(2, 'R') + pairCol(1, 'R') + pairCol(0, 'R');
  body += '</div>';

  document.getElementById('bracket-content').innerHTML =
    '<div class="br-intro">对称晋级路线 · 决赛居中、两侧各为半区 · 横向可左右滑动 · 点击比赛看详情 · 对阵未定显示「待定」</div>'
    + '<div class="bk-scroll">' + head + body + '</div>';
}

// 今日焦点：点击跳转到赛程预测并定位到对应比赛
function goToMatch(matchId, matchDate) {
  // 1. 切换到赛程预测页（按 onclick 定位该标签，避免误选第一个标签）
  const tab = Array.from(document.querySelectorAll('.nav-tab'))
    .find(t => (t.getAttribute('onclick')||'').includes("'matches'"));
  showPage('matches', tab);
  // 2. 把日期过滤器设置为该场比赛的日期并重新渲染
  const dateInput = document.getElementById('date-filter');
  if (dateInput) dateInput.value = matchDate;
  const target = matchesData.filter(m => m.date === matchDate);
  renderMatchList(target.length ? target : matchesData.filter(m => m.date >= matchDate).slice(0, 20));
  // 3. 等 DOM 渲染完再滚动定位
  setTimeout(() => {
    const el = document.getElementById('mc-' + matchId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function goToDerivedMatch(home, away, stage) {
  const exact = (matchesData || []).find(m =>
    m.stage === stage && (
      (m.home === home && m.away === away) ||
      (m.home === away && m.away === home)
    )
  );
  if (exact) {
    goToMatch(exact.id, exact.date);
    return;
  }

  const tab = Array.from(document.querySelectorAll('.nav-tab'))
    .find(t => (t.getAttribute('onclick')||'').includes("'matches'"));
  showPage('matches', tab);

  const dateInput = document.getElementById('date-filter');
  if (dateInput) dateInput.value = '';

  renderMatchList([{
    id: 'derived-' + home + '-' + away,
    synthetic: true,
    stage,
    group: null,
    home,
    away,
    home_score: null,
    away_score: null,
    status: 'upcoming',
    date: stage + ' · 赛程待定',
    bjt: '',
  }]);
}

// ────────────────────────────────────────
// V4: 今日焦点页
// ────────────────────────────────────────
function renderFocus() {
  function getMatchPriority(m) {
    const pr = getPred(m.home, m.away);
    const pred = pr?.pred;
    const groupKey = m.group ? m.group + '组' : '';
    const homeMI = getMI(m.home, groupKey);
    const awayMI = getMI(m.away, groupKey);
    const upset = pred ? getUpsetRisk(m.home, m.away, pred) : null;
    const clash = pred ? getTacticClash(getTacticTag(m.home), getTacticTag(m.away)) : null;
    if (homeMI.mi >= 1.25 || awayMI.mi >= 1.25) return {p:1, tag:'生死战', cls:'focus-tag-death'};
    if (upset?.level === 'high') return {p:2, tag:'🔥高冷门风险', cls:'focus-tag-upset'};
    if (clash) return {p:3, tag:'⚔️战术克制', cls:'focus-tag-tactic'};
    return {p:4, tag:'正路走势', cls:'focus-tag-normal'};
  }

  // 取下一个还有 upcoming 比赛的日期（BJT），展示该日全部比赛
  const upcoming = matchesData
    .filter(m => m.status === 'upcoming')
    .sort((a, b) => (a.date + (a.bjt||'')).localeCompare(b.date + (b.bjt||'')));

  if (!upcoming.length) {
    document.getElementById('focus-content').innerHTML = '<div class="no-data"><div class="no-data-icon">🏆</div><div>全部比赛已结束</div></div>';
    return;
  }

  const nextDate = upcoming[0].date;
  const next4 = upcoming.filter(m => m.date === nextDate);

  const header = '<div style="font-size:11px;color:var(--t2);margin-bottom:14px">' + nextDate + ' 全部 ' + next4.length + ' 场 · 按时间排列</div>';

  const cards = next4.map(m => {
    const pr = getPred(m.home, m.away);
    const pred = pr?.pred;
    const rev = pr?.rev;
    const win = pred ? (rev ? pred.loss : pred.win) : 50;
    const draw = pred ? pred.draw : 25;
    const loss = pred ? (rev ? pred.win : pred.loss) : 25;
    const priority = getMatchPriority(m);
    const statusBadge = '<span class="focus-status-badge focus-status-upcoming">即将开赛</span>';
    const rightPanel = pred ? '<div class="focus-bar-wrap">'
      + '<div class="focus-bar-row"><span style="width:28px;text-align:right">' + win + '%</span><div class="focus-bar-mini"><div class="focus-bar-fill" style="width:' + win + '%;background:var(--green)"></div></div></div>'
      + '<div class="focus-bar-row"><span style="width:28px;text-align:right">' + draw + '%</span><div class="focus-bar-mini"><div class="focus-bar-fill" style="width:' + draw + '%;background:var(--amber)"></div></div></div>'
      + '<div class="focus-bar-row"><span style="width:28px;text-align:right">' + loss + '%</span><div class="focus-bar-mini"><div class="focus-bar-fill" style="width:' + loss + '%;background:var(--red)"></div></div></div>'
      + '</div>' : '';
    return '<div class="focus-card" onclick="goToMatch(' + m.id + ', \'' + m.date + '\')">'
      + '<div class="focus-card-main">'
      + '<div class="focus-card-teams">' + (FLAGS[m.home]||'🏳️') + ' ' + m.home + ' vs ' + m.away + ' ' + (FLAGS[m.away]||'🏳️') + '</div>'
      + '<div class="focus-card-meta">'
      + '<span>' + m.date + ' ' + (m.bjt||'') + ' BJT</span>'
      + '<span class="gpill">' + (m.group ? m.group + '组' : (m.stage||'淘汰赛')) + '</span>'
      + statusBadge
      + '<span class="focus-card-tag ' + priority.cls + '">' + priority.tag + '</span>'
      + '</div></div>'
      + rightPanel
      + '</div>';
  }).join('');

  document.getElementById('focus-content').innerHTML = header + cards
    + '<div style="font-size:10px;color:var(--t3);text-align:center;margin-top:8px">点击任意比赛跳转完整赛程预测页</div>';
}
